<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: 215.9mm 330.2mm;
            margin-top: 10mm;
            margin-bottom: 20mm;
            margin-left: 30mm;
            margin-right: 25mm;
        }
        body {
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            margin: 0;
            padding: 0;
        }
        thead {
            display: table-header-group;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            border: 1px solid #000;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }
        th, td {
            border: 1px solid #000;
            padding: 6px;
            vertical-align: top;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }
        .center { text-align: center; }
        .bold { font-weight: bold; }
        .v-middle { vertical-align: middle; }
        
        table { page-break-inside: auto; }
        tr { page-break-inside: auto; }
        thead tr { page-break-inside: avoid; page-break-after: auto; }
        td, th, tbody, thead, tfoot { page-break-inside: auto; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <td colspan="4" class="center bold" style="padding: 20px; border-bottom: 1px solid #000;">
                    HEADER (Should repeat)
                </td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="width: 100px;">Prosedur</td>
                <td>
                    <ol>
                        <li>Step 1: Start procedure.</li>
                        <li>Step 2: Do something.</li>
                        <li>Step 3: Keep doing it.</li>
                        <div style="height: 800px; background: #eee;">Filler content to push to next page...</div>
                        <li>Step 4: This should be on the next page.</li>
                        <li>Step 5: Finish.</li>
                    </ol>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
